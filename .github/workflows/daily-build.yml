name: Daily Build

on:
  # Run every day at 06:00 UTC.
  # schedule:
  #   - cron: '0 6 * * *'
  # Allow manual trigger.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-x86_64:
    name: Build x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview, rustfmt, clippy

      - name: Cache Limine binaries
        uses: actions/cache@v4
        with:
          path: tools/limine-cache
          key: limine-12.3.3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso util-linux

      - name: Build x86_64 kernel and boot images
        run: ./build.sh x86_64

      - name: Boot test x86_64 ISO in QEMU/SeaBIOS
        run: |
          timeout 60s qemu-system-x86_64 \
            -cdrom build/ApertureOS-x86_64.iso -boot d \
            -m 512 -smp 1 -serial file:/tmp/qemu-bios.log -display none \
            2>&1 || true
          echo "--- BIOS boot log ---"
          tail -40 /tmp/qemu-bios.log
          if grep -q "Aperture OS x86_64 kernel booting" /tmp/qemu-bios.log; then
            echo "BIOS boot test passed"
          else
            echo "BIOS boot test failed"
            exit 1
          fi

      - name: Boot test x86_64 ISO in QEMU/OVMF
        run: |
          OVMF_CODE="$(find /usr/share -maxdepth 3 -name 'OVMF_CODE_4M.fd' | head -n1)"
          OVMF_VARS="$(find /usr/share -maxdepth 3 -name 'OVMF_VARS_4M.fd' | head -n1)"
          echo "OVMF code: $OVMF_CODE"
          echo "OVMF vars: $OVMF_VARS"
          if [[ -z "$OVMF_CODE" || -z "$OVMF_VARS" ]]; then
            echo "Could not locate OVMF pflash files."
            exit 1
          fi
          cp "$OVMF_VARS" /tmp/ovmf_vars.fd
          timeout 60s qemu-system-x86_64 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=/tmp/ovmf_vars.fd \
            -cdrom build/ApertureOS-x86_64.iso -boot d \
            -m 512 -smp 1 -serial file:/tmp/qemu-uefi.log -display none \
            2>&1 || true
          echo "--- UEFI boot log ---"
          tail -40 /tmp/qemu-uefi.log

      - name: Run host tests
        run: cargo test -p x86-decode -p pe-parser -p aarch64-decode

      - name: Upload x86_64 ISO
        uses: actions/upload-artifact@v4
        with:
          name: aperture-os-x86_64-iso
          path: build/ApertureOS-x86_64.iso
          if-no-files-found: error

  build-aarch64:
    name: Build AArch64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, llvm-tools-preview, rustfmt, clippy

      - name: Cache Limine binaries
        uses: actions/cache@v4
        with:
          path: tools/limine-cache
          key: limine-12.3.3

      - name: Install AArch64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu qemu-system-arm qemu-efi-aarch64 xorriso

      - name: Build AArch64 kernel and boot image
        run: ./build.sh aarch64

      - name: Boot test AArch64 ISO in QEMU/virt with UEFI
        run: |
          cp /usr/share/qemu-efi-aarch64/QEMU_EFI.fd /tmp/aarch64_efi.fd
          # The AArch64 early console uses QEMU semihosting (SYS_WRITEC)
          # until the kernel programs its own MMU to map the PL011 UART, so
          # capture QEMU stdout+stderr (where semihosting lands) in addition
          # to the serial file. -device ramfb gives UEFI GOP a framebuffer.
          timeout 60s qemu-system-aarch64 \
            -machine virt -cpu cortex-a72 -m 512 \
            -bios /tmp/aarch64_efi.fd \
            -cdrom build/ApertureOS-aarch64.iso -boot d \
            -serial file:/tmp/qemu-aarch64.log -monitor none \
            -device ramfb -semihosting -display none \
            > /tmp/qemu-aarch64-stdout.log 2>&1 || true
          cat /tmp/qemu-aarch64-stdout.log >> /tmp/qemu-aarch64.log || true
          echo "--- AArch64 UEFI boot log ---"
          tail -40 /tmp/qemu-aarch64.log
          if grep -q "Aperture OS AArch64 kernel booting" /tmp/qemu-aarch64.log && \
             grep -q "Framebuffer:" /tmp/qemu-aarch64.log; then
            echo "AArch64 UEFI boot test passed"
          else
            echo "AArch64 UEFI boot test failed"
            exit 1
          fi

      - name: Run host tests
        run: cargo test -p x86-decode -p pe-parser -p aarch64-decode

      - name: Upload AArch64 ISO
        uses: actions/upload-artifact@v4
        with:
          name: aperture-os-aarch64-iso
          path: build/ApertureOS-aarch64.iso
          if-no-files-found: error

  release:
    name: Create nightly release
    runs-on: ubuntu-latest
    needs: [build-x86_64, build-aarch64]
    if: github.event_name != 'pull_request'
    steps:
      - name: Download x86_64 ISO
        uses: actions/download-artifact@v4
        with:
          name: aperture-os-x86_64-iso
          path: release/

      - name: Download AArch64 ISO
        uses: actions/download-artifact@v4
        with:
          name: aperture-os-aarch64-iso
          path: release/

      - name: Compute nightly timestamp
        id: ts
        run: |
          RELEASE_TS="$(date -u +%Y-%m-%d-%H%M%S)"
          echo "ts=${RELEASE_TS}" >> "$GITHUB_OUTPUT"

      - name: Rename assets with timestamp
        run: |
          mv release/ApertureOS-x86_64.iso "release/aperture-os-x86_64-${RELEASE_TS}.iso"
          mv release/ApertureOS-aarch64.iso "release/aperture-os-aarch64-${RELEASE_TS}.iso"
        env:
          RELEASE_TS: ${{ steps.ts.outputs.ts }}

      - name: Create nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly-${{ steps.ts.outputs.ts }}
          name: Aperture OS nightly ${{ steps.ts.outputs.ts }}
          body: |
            Automated daily build of Aperture OS.

            Assets:
            - `aperture-os-x86_64-${{ steps.ts.outputs.ts }}.iso` — hybrid BIOS+UEFI bootable ISO
            - `aperture-os-aarch64-${{ steps.ts.outputs.ts }}.iso` — AArch64 UEFI bootable ISO
          files: release/*
          prerelease: true
