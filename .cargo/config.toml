[alias]
build-os = "build -p kernel"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "force-frame-pointers",
    "-C", "link-arg=-Tkernel/arch/x86_64/linker.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "codegen-units=1",
]

[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C", "force-frame-pointers",
    "-C", "link-arg=-Tkernel/arch/aarch64/linker.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "codegen-units=1",
]